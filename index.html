<!DOCTYPE html>
<html>
<head>
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding-top: 100px;
        }

        .box {
            background: white;
            color: #222;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            font-size: 40px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🚀 Welcome to My Website</h1>

        <p>Ye meri first professional website hai!</p>

        <button onclick="alert('Welcome! 😎')">
            Click Me
        </button>
    </div>

</body>
</html>
